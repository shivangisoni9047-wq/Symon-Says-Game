<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Says Game</title>
</head>
<link rel ="stylesheet" href = "style.css"/>
<body>
    <h1>SIMON SAYS GAME</h1>
    <h2>Press Any Key to Start the Game!</h2>
    <div class="btn-container">
        <div class="line-one">
            <div class="btn yellow" type ="button" id="yellow"></div>
            <div class="btn pink" type ="button" id ="pink"></div>
        </div>
        <div class="line-two">
            <div class="btn skyblue" type ="button" id="skyblue"></div>
            <div class="btn purple" type ="button" id="purples"></div>
        </div>
    </div>
    <div class="highestscore">
        <h1>Your Highest score is: </h1>
        <h1><div class="score">0</div></h1>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
